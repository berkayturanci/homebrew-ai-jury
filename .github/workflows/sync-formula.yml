name: Sync formula from ai-jury

# The source repo cannot push here without a personal access token, because a
# workflow's GITHUB_TOKEN is scoped to its own repository. So the direction is
# inverted: this tap *pulls*. Reading a public release asset needs no credential
# at all, and GITHUB_TOKEN below is scoped to this repo, which is the one being
# written. No PAT to create, store, rotate, or leak.
#
# The source is the *release asset*, not a file on the source repo's `main`.
# ai-jury#666 removed `Formula/ai-jury.rb` from that repository: a committed
# formula names an sdist url and a sha256, and neither is knowable until the tag
# is pushed, so keeping it true cost a second write to `main` after every
# release — which failed four different ways. The formula is now rendered during
# the release and attached to it, so `releases/latest/download/ai-jury.rb` is
# always the newest one and is never stale.
#
# The asset does not exist yet on releases cut before that change, and this
# workflow runs every thirty minutes. A missing asset is therefore an ordinary
# state, not a fault: the fetch below records it and the rest of the job is
# skipped. Failing on it would replace one red cron with another.
#
# The trade is latency — up to the schedule interval, or zero via Run workflow.
# Acceptable because the source repo already fails its own release when the
# formula does not match what PyPI published, so what arrives here late is at
# least correct.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-formula
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fetch the formula from the latest release
        id: fetch
        run: |
          set -euo pipefail
          asset="https://github.com/berkayturanci/ai-jury/releases/latest/download/ai-jury.rb"
          if curl -fsSL "$asset" -o /tmp/incoming.rb && [ -s /tmp/incoming.rb ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "fetched $asset"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::formula asset not published yet — the newest ai-jury release predates the change that attaches ai-jury.rb to it. Nothing to sync; this tap keeps serving the formula it has. The next release will carry the asset."
          fi

      - name: Refuse to publish a formula that cannot install
        if: steps.fetch.outputs.found == 'true'
        # This tap is what `brew install` reads, so a broken formula here is a
        # broken install for everyone. Never mirror blindly: verify the url
        # resolves and the digest is the digest of what it points at, exactly as
        # brew will. ai-jury#562 shipped a formula whose url 404'd.
        run: |
          set -euo pipefail
          url=$(grep -m1 -oE 'url "[^"]+"' /tmp/incoming.rb | cut -d'"' -f2)
          want=$(grep -m1 -oE 'sha256 "[0-9a-f]{64}"' /tmp/incoming.rb | cut -d'"' -f2)
          echo "url:  $url"
          curl -fsSL "$url" -o /tmp/artifact
          got=$(sha256sum /tmp/artifact | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::incoming formula's sha256 does not match its own url; not publishing"
            echo "want $want"
            echo "got  $got"
            exit 1
          fi
          echo "verified"

      - name: Commit when it differs
        if: steps.fetch.outputs.found == 'true'
        run: |
          set -euo pipefail
          if diff -q /tmp/incoming.rb Formula/ai-jury.rb >/dev/null 2>&1; then
            echo "already in sync"
            exit 0
          fi
          cp /tmp/incoming.rb Formula/ai-jury.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ai-jury.rb
          git commit -m "chore: sync formula from berkayturanci/ai-jury"
          git push
